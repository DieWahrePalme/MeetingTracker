<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Seite nicht gefunden | Ich hasse Meetings</title>
    <style>
      :root { --bg: #f4f1ea; --text: #14110f; --muted: #665f55; --accent: #ff5b14; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0d0c; --text: #f4f1ea; --muted: #a69f94; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      main { max-width: 420px; }
      .code { font-size: 4.5rem; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); margin: 0; }
      h1 { font-size: 1.4rem; margin: 8px 0; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 28px; }
      a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 99px; background: var(--accent); color: #14110f; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Diese Seite gibt es nicht.</h1>
      <p>Wie ein Meeting ohne Tagesordnung: Hier ist nichts zu holen.</p>
      <a href="/">Zur Startseite</a>
    </main>
  </body>
</html>
